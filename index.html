<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Branch</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: #f1f5f9;
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
    }

    .muted,
    #status {
      color: #64748b;
      font-size: 14px;
    }

    button,
    select,
    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    button {
      color: white;
      background: #2563eb;
      border-color: #2563eb;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .summary-card {
      padding: 18px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 16px #0f172a0a;
    }

    .summary-card span {
      display: block;
      margin-bottom: 8px;
      color: #64748b;
      font-size: 14px;
    }

    .summary-card strong {
      font-size: 24px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 12px;
    }

    select {
      min-width: 170px;
    }

    input {
      flex: 1;
      min-width: 240px;
    }

    .table-container {
      max-height: 70vh;
      overflow: auto;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 1300px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      white-space: nowrap;
      text-align: left;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #e2e8f0;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    @media (max-width: 650px) {
      body {
        padding: 18px 12px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      input {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Dashboard Branch</h1>
        <div class="muted">Data diambil dari Google Sheets</div>
      </div>

      <button id="refreshButton" type="button">Muat ulang data</button>
    </header>

    <section class="summary">
      <div class="summary-card">
        <span>Jumlah Branch</span>
        <strong id="branchCount">—</strong>
      </div>

      <div class="summary-card">
        <span>Total Active Subscribers</span>
        <strong id="subscriberTotal">—</strong>
      </div>

      <div class="summary-card">
        <span>Total Engineer</span>
        <strong id="engineerTotal">—</strong>
      </div>
    </section>

    <div class="controls">
      <select id="provinceFilter">
        <option value="">Semua Province</option>
      </select>

      <select id="roFilter">
        <option value="">Semua RO</option>
      </select>

      <input
        id="searchInput"
        type="search"
        placeholder="Cari branch atau data lainnya..."
      >
    </div>

    <p id="status">Memuat data…</p>

    <div class="table-container">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Ganti dengan URL CSV dari Google Sheets Anda.
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRshCAJ18IszHmUTABcnupCQzwGspNG_YuaHvUCGWsh8y0vySc3xeO34Z27sivjhBaV7DwpkOFXR1Ef/pub?gid=921583349&single=true&output=csv";

    const statusElement = document.getElementById("status");
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("tableBody");
    const provinceFilter = document.getElementById("provinceFilter");
    const roFilter = document.getElementById("roFilter");
    const searchInput = document.getElementById("searchInput");

    let headers = [];
    let records = [];

    // Membaca CSV, termasuk sel yang berisi koma dan tanda kutip.
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
          cell += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && next === "\n") i++;

          row.push(cell.trim());
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }

      return rows;
    }

    function normalizeHeader(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function columnIndex(name) {
      return headers.findIndex(
        header => normalizeHeader(header) === normalizeHeader(name)
      );
    }

    function addOptions(selectElement, values, defaultLabel) {
      selectElement.replaceChildren();

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = defaultLabel;
      selectElement.appendChild(defaultOption);

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectElement.appendChild(option);
      });
    }

    function formatNumber(value) {
      const number = Number(value);
      return Number.isFinite(number)
        ? new Intl.NumberFormat("id-ID").format(number)
        : value;
    }

    function renderTable() {
      const provinceIndex = columnIndex("Province");
      const roIndex = columnIndex("RO");

      const selectedProvince = provinceFilter.value.toLowerCase();
      const selectedRO = roFilter.value.toLowerCase();
      const query = searchInput.value.trim().toLowerCase();

      const filteredRecords = records.filter(record => {
        const province = String(record[provinceIndex] || "").toLowerCase();
        const ro = String(record[roIndex] || "").toLowerCase();
        const allValues = record.join(" ").toLowerCase();

        return (!selectedProvince || province === selectedProvince) &&
          (!selectedRO || ro === selectedRO) &&
          (!query || allValues.includes(query));
      });

      tableBody.replaceChildren();

      filteredRecords.forEach(record => {
        const tr = document.createElement("tr");

        headers.forEach((header, index) => {
          const td = document.createElement("td");
          const value = record[index] || "";

          // Format angka agar pemisah ribu tampil sesuai lokal Indonesia.
          const isNumericColumn = [
            "No",
            "Active Subscribers",
            "NOE",
            "NOB",
            "Total Engineer",
            "Existing",
            "Requirement"
          ].some(name => normalizeHeader(name) === normalizeHeader(header));

          td.textContent = isNumericColumn ? formatNumber(value) : value;
          tr.appendChild(td);
        });

        tableBody.appendChild(tr);
      });

      statusElement.textContent =
        `Menampilkan ${filteredRecords.length} dari ${records.length} baris.`;
    }

    function updateSummary() {
      const branchIndex = columnIndex("Branch");
      const subscribersIndex = columnIndex("Active Subscribers");
      const engineerIndex = columnIndex("Total Engineer");

      const uniqueBranches = new Set(
        records
          .map(record => record[branchIndex])
          .filter(Boolean)
      );

      const subscribersTotal = records.reduce(
        (sum, record) => sum + parseLocalizedNumber(record[subscribersIndex]),
        0
      );

      const engineersTotal = records.reduce(
        (sum, record) => sum + parseLocalizedNumber(record[engineerIndex]),
        0
      );

      document.getElementById("branchCount").textContent =
        formatNumber(uniqueBranches.size);

      document.getElementById("subscriberTotal").textContent =
        formatNumber(subscribersTotal);

      document.getElementById("engineerTotal").textContent =
        formatNumber(engineersTotal);
    }

    // Membaca angka seperti 10.190 sebagai 10190.
    function parseLocalizedNumber(value) {
      if (!value) return 0;

      const cleaned = String(value)
        .replace(/\s/g, "")
        .replace(/\./g, "")
        .replace(/,/g, ".");

      const number = Number(cleaned);
      return Number.isFinite(number) ? number : 0;
    }

    async function loadData() {
      try {
        if (CSV_URL.includes("TEMPEL_URL")) {
          throw new Error("URL CSV belum diganti.");
        }

        statusElement.textContent = "Memuat data…";

        const url = new URL(CSV_URL);
        url.searchParams.set("_refresh", Date.now());

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Gagal mengambil CSV: HTTP ${response.status}`);
        }

        const csvText = (await response.text()).replace(/^\uFEFF/, "");
        const rows = parseCSV(csvText);

        // Cari baris header tabel, walaupun ada judul/baris lain di atasnya.
        const headerIndex = rows.findIndex(row => {
          const normalized = row.map(normalizeHeader);

          return normalized.includes("province") &&
            normalized.includes("ro") &&
            normalized.includes("branch") &&
            normalized.includes("activesubscribers");
        });

        if (headerIndex === -1) {
          throw new Error(
            "Header tidak ditemukan. Pastikan kolomnya bernama Province, RO, Branch, dan Active Subscribers."
          );
        }

        headers = rows[headerIndex];

        records = rows
          .slice(headerIndex + 1)
          .filter(row =>
            row.some(value => value !== "") &&
            row.length > 1
          )
          .map(row => headers.map((_, index) => row[index] || ""));

        // Buat header tabel sesuai urutan kolom di Sheet.
        const headerRow = document.createElement("tr");

        headers.forEach(header => {
          const th = document.createElement("th");
          th.textContent = header;
          headerRow.appendChild(th);
        });

        tableHead.replaceChildren(headerRow);

        const provinceIndex = columnIndex("Province");
        const roIndex = columnIndex("RO");

        const provinces = [...new Set(
          records.map(record => record[provinceIndex]).filter(Boolean)
        )].sort();

        const ros = [...new Set(
          records.map(record => record[roIndex]).filter(Boolean)
        )].sort();

        addOptions(provinceFilter, provinces, "Semua Province");
        addOptions(roFilter, ros, "Semua RO");

        updateSummary();
        renderTable();
      } catch (error) {
        console.error(error);
        statusElement.textContent =
          "Data gagal dimuat. Periksa URL CSV dan nama header di Google Sheets.";
      }
    }

    provinceFilter.addEventListener("change", renderTable);
    roFilter.addEventListener("change", renderTable);
    searchInput.addEventListener("input", renderTable);
    document.getElementById("refreshButton").addEventListener("click", loadData);

    loadData();
  </script>
</body>
</html>
